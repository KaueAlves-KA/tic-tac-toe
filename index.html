<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tic Tac Toe | KA.Dev</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <!-- Main title -->
  <h1><span class="red">Tic</span> Tac <span class="blue">Toe</span></h1>

  <!-- Turn indicator -->
  <div id="turn-status">It's Player X's turn now</div>

  <!-- The board -->
  <div class="board">
    <!-- Each cell has a data-index, so JavaScript knows 
    which cell corresponds to which number -->
    <div class="cell" data-index="0"></div>
    <div class="cell" data-index="1"></div>
    <div class="cell" data-index="2"></div>
    <div class="cell" data-index="3"></div>
    <div class="cell" data-index="4"></div>
    <div class="cell" data-index="5"></div>
    <div class="cell" data-index="6"></div>
    <div class="cell" data-index="7"></div>
    <div class="cell" data-index="8"></div>
  </div>
  <h3>&lt;KA.Dev/&gt;</h3>

  <!-- Button to restart the game -->
  <button id="restart-button">Restart Game</button>

  <script src="script.js"></script>
</body>
</html>
